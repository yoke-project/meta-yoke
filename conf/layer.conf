# The Yocto Project layer for Yoke: the recipes that build what Yoke released into an image.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "yoke"
BBFILE_PATTERN_yoke = "^${LAYERDIR}/"
BBFILE_PRIORITY_yoke = "6"

# One branch per series: this one is wrynose's.
LAYERSERIES_COMPAT_yoke = "wrynose"
# openembedded-layer carries gRPC, protobuf-c and LVGL, which the families and the panel build against;
# meta-python carries the Python family's gRPC and its generator.
LAYERDEPENDS_yoke = "core openembedded-layer meta-python"
